<text x="56.0" y="122.0" fill="#5D6873" font-family="Source Han Serif SC, Songti SC, STSong, serif" font-size="14" font-weight="400" text-anchor="start" id="hero-thesis-1">作者意图以 YAML / JSON 进入，经 validate、analyze、compile 收成一份编译 IR。</text>
