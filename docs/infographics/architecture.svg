<text x="236.0" y="326.0" fill="#5D6873" font-family="Source Han Serif SC, Songti SC, STSong, serif" font-size="13" font-weight="400" text-anchor="start" id="el-submit">提交意图</text>
<text x="524.0" y="356.0" fill="#5D6873" font-family="Source Han Serif SC, Songti SC, STSong, serif" font-size="13" font-weight="400" text-anchor="start" id="el-ok">结构通过</text>
