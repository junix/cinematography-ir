<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" xml:lang="zh-CN" aria-labelledby="svg-title svg-desc">
<title id="svg-title">cinematography-ir 架构：意图进门，编译出腰</title>
<desc id="svg-desc">作者意图以 YAML 或 JSON 进入，经 validate、analyze、compile 收成一份编译 IR；prompt、view、render 只消费这份产物。</desc>
