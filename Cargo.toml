[package]
name = "cinematography-ir"
version = "0.1.0"
edition = "2021"
description = "Layered cinematography planning IR, validator, and continuity analyzer"
license = "MIT"

[lib]
name = "cinematography_ir"
path = "src/lib.rs"

[[bin]]
name = "cine-ir"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
resvg = "0.48"
tiny-skia = "0.12"
usvg = "0.48"

[dev-dependencies]
pretty_assertions = "1.4"
